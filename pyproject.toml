[project]
name = "spamshield"
version = "0.1.0"
description = "SpamShield — SMS spam detection and comparison of six machine learning algorithms."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.4",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "streamlit>=1.39",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spamshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PT"]
